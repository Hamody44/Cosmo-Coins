<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmo Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0e17;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        body.manage-page {
            background: #080b14;
        }
        .navbar {
            background-color: #151b2b;
            border-bottom: 1px solid #232c45;
        }
        .card {
            background-color: #151b2b;
            border: 1px solid #232c45;
            border-radius: 14px;
            color: #f1f5f9;
        }
        .card-header {
            background-color: #1a2236;
            border-bottom: 1px solid #232c45;
            color: #ffffff;
            font-weight: bold;
        }
        .text-muted-custom {
            color: #94a3b8 !important;
        }
        .form-control, .form-select {
            background-color: #0b0e17;
            border: 1px solid #334155;
            color: #ffffff !important;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0b0e17;
            border-color: #3b82f6;
            color: #ffffff;
        }
        .btn-discord {
            background-color: #5865F2;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-discord:hover {
            background-color: #4752c4;
            color: #ffffff;
        }
        .table-custom {
            color: #ffffff;
            border-color: #232c45;
        }
        .table-custom th {
            background-color: #1a2236;
            color: #ffffff;
        }
        .table-custom td {
            background-color: #151b2b;
            color: #e2e8f0;
        }
        .manage-page .card {
            box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
        }
        .manage-page .form-label {
            line-height: 1.5;
        }
        .manage-page .alert {
            border-radius: 10px;
            line-height: 1.8;
        }
        @media (max-width: 576px) {
            body.manage-page .navbar {
                padding-inline: 14px !important;
            }
            body.manage-page .navbar-brand {
                font-size: 1.05rem !important;
            }
            body.manage-page .navbar .btn {
                padding: .3rem .45rem;
                font-size: .72rem;
            }
            body.manage-page > .container {
                padding-inline: 14px;
            }
            .manage-page .card {
                border-radius: 16px;
                padding: 1.15rem !important;
            }
            .manage-page h2 {
                font-size: 1.35rem;
                line-height: 1.5;
            }
            .manage-page h4,
            .manage-page h5 {
                line-height: 1.55;
            }
            .manage-page .form-label {
                font-size: .95rem;
                margin-bottom: .45rem;
            }
            .manage-page .form-select,
            .manage-page .form-control {
                min-height: 48px;
                border-radius: 9px;
            }
            .manage-page .table {
                min-width: 520px;
            }
        }
    </style>
</head>
<body class="{% if request.endpoint == 'manage' %}manage-page{% endif %}">
    <nav class="navbar navbar-expand-lg px-4 mb-4">
        <a class="navbar-brand text-light fw-bold fs-4" href="/">🪙 Cosmo Panel</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user %}
                <a href="/profile" class="btn btn-outline-info btn-sm">👤 الملف الشخصي</a>
                <a href="/servers" class="btn btn-outline-light btn-sm">🏛️ السيرفرات</a>
                <form method="post" action="{{ url_for('logout') }}" class="m-0">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-danger btn-sm">خروج</button>
                </form>
            {% else %}
                <a href="/login" class="btn btn-discord btn-sm">تسجيل الدخول بديسكورد</a>
            {% endif %}
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
